name: Segnali
on:
  schedule:
    - cron: '17 11 * * 1-5'   # 13:17 ora italiana: metà seduta europea
    - cron: '37 21 * * 1-5'   # dopo la chiusura di Wall Street
    - cron: '23 7 * * 6'      # sabato: auto-miglioramento settimanale
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily o learn'
        default: 'daily'
  push:
    paths: ['.github/workflows/segnali.yml']
permissions:
  contents: write
concurrency:
  group: segnali
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa app (solo la prima volta)
        run: if [ -f app.zip ]; then unzip -o app.zip && rm app.zip; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Esegui
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE=daily
          if [ "${{ github.event.schedule }}" = "23 7 * * 6" ]; then MODE=learn; fi
          if [ -n "${{ github.event.inputs.mode }}" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          python run.py $MODE
      - name: Salva risultati
        if: always()
        run: |
          git config user.name "segnali-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiornamento $(date -u '+%F %H:%M')" || echo "Nessuna modifica"
          git push
